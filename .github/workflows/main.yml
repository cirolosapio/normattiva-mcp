name: Deploy to AWS Lambda

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      deployments: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create GitHub Deployment
        id: create_deployment
        uses: actions/github-script@v9
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install Serverless Framework
        run: npm install -g serverless@3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: "--prefer-dist --optimize-autoloader --no-dev"

      - name: Cache cacheable
        run: php artisan optimize -e config

      - name: Deploy to AWS Lambda
        id: sls_deploy
        run: |
          output=$(serverless deploy 2>&1)
          echo "$output"
          endpoint=$(echo "$output" | grep -oP 'endpoint: \K\S+')
          echo "endpoint=$endpoint" >> $GITHUB_OUTPUT
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Update Deployment Status (success)
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'success',
              environment_url: '${{ steps.sls_deploy.outputs.endpoint }}',
            });

      - name: Update Deployment Status (failure)
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create_deployment.outputs.deployment_id }},
              state: 'failure',
            });

  github-release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: v${{ github.run_number }}
