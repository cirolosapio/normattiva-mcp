name: Deploy to AWS Lambda

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      deployments: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        
      - name: Install Serverless Framework
        run: npm install -g serverless@3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: "--prefer-dist --optimize-autoloader --no-dev"

      - name: Cache cacheable
        run: php artisan optimize -e config

      - name: Deploy to AWS Lambda
        id: deploy
        run: |
          OUTPUT=$(serverless deploy)

          echo "$OUTPUT"

          URL=$(echo "$OUTPUT" | grep "endpoint:" | awk '{print $2}')

          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment-url: ${{ steps.deploy.outputs.url }}
          initial-status: pending

  github-release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: v${{ github.run_number }}
